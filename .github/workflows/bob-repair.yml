name: Bob repair experiment

on:
  workflow_dispatch:
    inputs:
      accept_ibm_license:
        description: 'I have read and accept the IBM Bob Shell license (check runner log or IBM site)'
        type: boolean
        required: true
        default: false

jobs:
  bob-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure Bob key is configured
        env:
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
        run: test -n "$BOB_API_KEY"
      - name: Install official IBM Bob Shell
        run: |
          curl -fsSL https://bob.ibm.com/download/bobshell.sh -o /tmp/envreplay-bobshell-install.sh
          timeout 180s bash /tmp/envreplay-bobshell-install.sh --package-manager npm
      - name: Display IBM Bob license and check user acceptance
        env:
          ACCEPTED: ${{ inputs.accept_ibm_license }}
        run: |
          bob --show-license
          test "$ACCEPTED" = true
      - name: Let Bob diagnose and repair the isolated failing revision
        env:
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
        run: python3 bob_workflow.py run --output "$RUNNER_TEMP/bob-report" --max-cost 1.0 --max-turns 12 --accept-license
      - name: Upload independent Bob run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envreplay-bob-evidence
          path: ${{ runner.temp }}/bob-report/
          if-no-files-found: warn
